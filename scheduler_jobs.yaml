# ============================================================
# 调度器任务配置（scheduler.py 的配置驱动来源）
# ============================================================
# 任务定义从 scheduler.py 拆到这里：调整执行时间 / 停用某个任务 / 加任务，
# 改本文件即可，不需要动代码。
#
# 顶层结构：
#   timezone - 全局默认时区（任务没单独写 timezone 时用这个）
#   jobs     - 任务列表，每项是：
#     id          任务唯一标识（APScheduler job id，省略时用 func）
#     func        函数路径，'module.path:attribute' 形式，attribute 支持带点
#     cron        定时表达式，字段白名单 =
#                 year / month / day / week / day_of_week / hour / minute / second
#                 / start_date / end_date / timezone / jitter
#     kwargs      传给任务函数的参数字典（YAML 的 true/false/null 即 Python 的
#                 True/False/None）
#     timezone    单任务时区（可选，覆盖全局默认）
#     enabled     设为 false 可临时停用该任务而不删除配置
#     (可选) misfire_grace_time / coalesce / max_instances / replace_existing
#            — APScheduler add_job 的同名参数，原样透传
#
# ⚠️ cron 里多写了白名单之外的键会在启动时注册失败（日志可见），
#    这是有意的：宁可启动时报错，也不要一个静默少任务的调度器。
#
# 时间基线（较初版整体提前 1 小时，且不早于 16:00）：
#   回测 16:00、调仓 16:30 —— 同属 16 点档，错开半小时避免并发；
#   数据刷新任务 18:05 起每隔 5~10 分钟陆陆续续执行完；
#   原 0:05 的交易日历刷新提前到前一日 23:05（跨过午夜，仍每天一次）。
# ============================================================

timezone: Asia/Shanghai

jobs:
  # 量化回测任务执行（每日 16:00；原 16:15，提前 1 小时触到 16:00 下界）
  - id: run_daily_strategy_all
    func: backtest.strategy.run_portfolio_daily:run_daily_strategy_all
    cron:
      hour: 16
      minute: 0

  # 量化回测任务执行，运算调仓计划（每日 16:30；原 16:30 提前 1 小时触到 16:00，
  # 与回测同档后错开半小时，避免两个重任务并发）
  - id: position_plan_daily_1630
    func: backtest.strategy.ai_position_plan_daily:job_position_plan_daily_all
    cron:
      hour: 16
      minute: 30

  # 周日 19:30 执行运算调仓计划（带交易日覆盖，用于补跑上周交易日；原 20:30）
  - id: position_plan_daily_sun
    func: backtest.strategy.ai_position_plan_daily:job_position_plan_daily_all
    cron:
      day_of_week: sun
      hour: 19
      minute: 30
    kwargs:
      trade_day_override: true

  # 每天刷新个股信息（18:05；数据刷新批次从 6 点后开始）
  - id: job_stock_daily_update
    func: job.job_stock_daily_update:job_stock_daily_update
    cron:
      hour: 18
      minute: 5

  # 技术面因子计算任务（个股池 + ETF 监控清单，见 job_update_factors.job_update_stock_factor_daily；18:10）。
  # ⚠️ 函数定义在 job/job_update_factors.py（job/__init__.py 只是转发），模块路径别写成 job_update_stock_factor_daily。
  - id: job_update_stock_factor_daily
    func: job.job_update_factors:job_update_stock_factor_daily
    cron:
      hour: 18
      minute: 10

  # 个股走势技术分析（降频：每周一/三/五，节省 agent 模式下的 token 消耗；18:15）
  - id: job_check_signal_daily
    func: job.job_check_signal:job_check_signal_daily
    cron:
      day_of_week: mon,wed,fri
      hour: 18
      minute: 15

  # 量化回测任务执行，运算个股 beta 数据（18:20）
  - id: job_update_stock_beta_all
    func: job.job_stock_daily_update:job_update_stock_beta_all
    cron:
      hour: 18
      minute: 20

  # 申万行业每日快照落库（板块轮动图数据源；上游只给最新一天，必须逐日累积；18:30）
  - id: job_update_sector_daily
    func: job.job_update_sector_daily:job_update_sector_daily
    cron:
      day_of_week: mon-fri
      hour: 18
      minute: 30

  # A 股每日估值快照落库（PE-TTM / PB，个股详情顶部报价 + 基本面走势图数据源；18:35）
  # ⚠️ 只对 A 股：databull get_stock_info 对港股/美股/ETF 直接 500（见 job 说明）。
  - id: job_update_stock_valuation_daily
    func: job.job_update_stock_valuation_daily:job_update_stock_valuation_daily
    cron:
      day_of_week: mon-fri
      hour: 18
      minute: 35

  # 每日更新 DCF 估值数据（监控池内标的全量重算，删缓存后由 dump_stocks_dcf 重新生成汇总；18:40）
  - id: job_stock_dcf_model_analysis_daily
    func: job.job_stock_dcf_model_analysis:job_stock_dcf_model_analysis_daily
    cron:
      hour: 18
      minute: 40

  # 每周五晚上更新基础评分（18:45）
  - id: job_update_financial_score_all
    func: job.job_update_factors:job_update_financial_score_all
    cron:
      day_of_week: fri
      hour: 18
      minute: 45

  # 更新个股恐贪数据（18:50）
  - id: job_update_stock_greedy_data_daily
    func: job.job_update_stock_greedy_data:job_update_stock_greedy_data_daily
    cron:
      hour: 18
      minute: 50

  # 更新 ETF 恐贪数据（独立于个股池：ETF 在 etf_watchlist，get_monitoring_stock_pool 取不到；18:55）
  # ⚠️ 必须整段重算（override_all=True）：False 会只补最新一天且不删旧 → 次日必 Duplicate
  - id: job_update_etf_greedy_data_daily
    func: job.job_update_stock_greedy_data:job_update_etf_greedy_data_daily
    cron:
      hour: 18
      minute: 55
    kwargs:
      override_all: true

  # 每天刷新交易日历并缓存到 Redis（databull trading_calendar 接口；23:05 前一日，原 0:05）
  - id: refresh_trading_calendar
    func: service.trading_calendar_service:refresh_trading_calendar
    cron:
      hour: 23
      minute: 5
    replace_existing: true

  # 个股散户情绪（东财股吧 24h 发帖 + LLM 三分类；19:10，避开 18:50/18:55 恐贪任务）
  # ⚠️ 只在交易日跑：周末帖子量只有交易日的一成左右，且不交易、无决策价值，
  #    少跑 2/7 的请求量可以显著降低触发反爬的概率。
  # ⚠️ 任务内部单只票之间串行 + 20 秒全局限速（见 service/eastmoney_guba.py），
  #    50 只约需 17 分钟，属正常耗时，不要误判为卡死。
  - id: job_stock_guba_sentiment_daily
    func: job.job_stock_guba_sentiment:job_stock_guba_sentiment_daily
    cron:
      day_of_week: mon-fri
      hour: 19
      minute: 10
    replace_existing: true